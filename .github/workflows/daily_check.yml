name: Ismail Kartal Kontrol Otopilotu

on:
  schedule:
    # Her gün Türkiye saatiyle 09:00'da (UTC 06:00) otomatik çalışır
    - cron: '0 6 * * *'
  workflow_dispatch: # İstediğin zaman elle de tetikleyebilmen için

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Haberleri Tara ve Yapay Zeka ile Analiz Et
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python check_status.py

      - name: Değişiklikleri GitHub'a Otomatik Gönder
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git status
          git commit -m "Otomatik Güncelleme: $(date +'%Y-%m-%d')" || exit 0
          git push
