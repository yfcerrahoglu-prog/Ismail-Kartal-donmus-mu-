<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İsmail Kartal Bugün Dönmüş mü?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 16:9 PC Ekranı İçin Fenerbahçe Temalı Dinamik Arka Plan */
            background: radial-gradient(circle at center, #002d62 0%, #000b18 100%);
            color: #ffffff;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Arka Plan Sarı-Lacivert Çizgi Desenleri */
        body::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 40px,
                rgba(254, 209, 0, 0.05) 40px,
                rgba(254, 209, 0, 0.05) 80px
            );
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .container {
            background: rgba(15, 23, 42, 0.85);
            padding: 40px 50px;
            border-radius: 24px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            border: 2px solid #fed100;
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(254, 209, 0, 0.2);
            position: relative;
            z-index: 10;
        }

        /* İsmail Kartal Karikatür İllüstrasyon Alanı */
        .avatar-box {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #fed100, #002d62);
            border-radius: 50%;
            padding: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #001e42;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #f8fafc;
            letter-spacing: 0.5px;
        }

        .status {
            font-size: 4.5rem;
            font-weight: 900;
            margin: 10px 0;
            letter-spacing: 3px;
        }
        .status.hayir {
            color: #fed100; /* Fenerbahçe Sarısı */
            text-shadow: 0 0 25px rgba(254, 209, 0, 0.6);
        }
        .status.evet {
            color: #22c55e;
            text-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
        }

        .date {
            font-size: 1.1rem;
            color: #cbd5e1;
            font-weight: 600;
            margin-top: 5px;
        }

        .description {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Vektörel Karikatür Simgesi -->
        <div class="avatar-box">
            <div class="avatar-inner">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#fed100" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </div>

        <h1>İsmail Kartal bugün dönmüş mü?</h1>
        
        <div id="status" class="status hayir">...</div>
        
        <div id="date" class="date">-</div>
        
        <p id="description" class="description"></p>
    </div>

    <script>
        fetch('data.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                const statusEl = document.getElementById('status');
                const descEl = document.getElementById('description');
                const dateEl = document.getElementById('date');

                statusEl.textContent = data.cevap.toUpperCase();
                descEl.textContent = data.aciklama;
                dateEl.textContent = data.tarih;

                if (data.cevap.toLowerCase() === 'evet') {
                    statusEl.className = 'status evet';
                } else {
                    statusEl.className = 'status hayir';
                }
            })
            .catch(error => {
                console.error('Hata:', error);
                document.getElementById('status').textContent = 'HATA';
            });
    </script>
</body>
</html>
