<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İsmail Kartal Bugün Dönmüş mü?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Arka plan bg.jpg dosyasi varsa onu gösterir, yoksa sarı-lacivert gradyan sunar */
            background: linear-gradient(rgba(0, 11, 24, 0.8), rgba(0, 11, 24, 0.9)), 
                        url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #00132b;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            background: rgba(15, 23, 42, 0.90);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            border: 2px solid #fed100;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 30px rgba(254, 209, 0, 0.3);
        }

        /* Karikatür Görsel Alanı (Tam Boyut) */
        .banner-box {
            width: 100%;
            max-height: 320px;
            margin-bottom: 25px;
            border-radius: 16px;
            border: 2px solid #fed100;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            background-color: #001e42;
        }

        .banner-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #f8fafc;
        }

        .status {
            font-size: 4.5rem;
            font-weight: 900;
            margin: 10px 0;
            letter-spacing: 3px;
        }
        .status.hayir {
            color: #fed100;
            text-shadow: 0 0 25px rgba(254, 209, 0, 0.6);
        }
        .status.evet {
            color: #22c55e;
            text-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
        }

        .date {
            font-size: 1.1rem;
            color: #cbd5e1;
            font-weight: 600;
            margin-top: 10px;
        }

        .description {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-top: 15px;
            font-style: italic;
        }

        .hayrat-footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            opacity: 0.85;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(254, 209, 0, 0.2);
            padding-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Karikatür Afişi -->
        <div class="banner-box">
            <img src="karikatur.jpg" alt="İsmail Kartal ve Aziz Yıldırım Karikatürü" onerror="this.parentElement.style.display='none'">
        </div>

        <h1>İsmail Kartal bugün dönmüş mü?</h1>
        
        <div id="status" class="status hayir">...</div>
        
        <p id="description" class="description"></p>
        <div id="date" class="date">-</div>

        <div class="hayrat-footer">
            ÇİFTYILDIZ ailesi başta olmak üzere tüm Fenerbahçe camiası için Yasin Ferhat CERRAHOĞLU hayratıdır.
        </div>
    </div>

    <script>
        fetch('data.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                const statusEl = document.getElementById('status');
                const descEl = document.getElementById('description');
                const dateEl = document.getElementById('date');

                const cevap = data.cevap || data.status || "HAYIR";
                const aciklama = data.aciklama || data.description || "Henüz yeni bir imza atılmadı, beklemedeyiz.";
                const tarih = data.tarih || data.date || data.last_updated || "";

                statusEl.textContent = cevap.toUpperCase();
                descEl.textContent = aciklama;
                dateEl.textContent = tarih ? "Son Güncelleme: " + tarih : "";

                if (cevap.toLowerCase() === 'evet') {
                    statusEl.className = 'status evet';
                } else {
                    statusEl.className = 'status hayir';
                }
            })
            .catch(error => {
                console.error('Data yüklenemedi:', error);
                document.getElementById('status').textContent = 'HAYIR';
                document.getElementById('description').textContent = 'Henüz yeni bir imza atılmadı, beklemedeyiz.';
            });
    </script>
</body>
</html>
